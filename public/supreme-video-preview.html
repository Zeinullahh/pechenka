<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supreme Thumbnail Generator</title>
    <style>
      :root {
        --purple-glow: #a855f7;
        --purple-core: #7e22ce;
        --cyan-accent: #06b6d4;
        --glass-border: rgba(255, 255, 255, 0.4);
        --glass-surface: rgba(255, 255, 255, 0.05);
        --bg-dark: #020617;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        /* Richer, multi-layered background */
        background-color: var(--bg-dark);
        background-image: 
            radial-gradient(circle at 20% 30%, rgba(126, 34, 206, 0.25) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
            linear-gradient(to bottom, #0f172a 0%, #020617 100%);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: "Segoe UI", Inter, sans-serif;
      }

      /* Scanline overlay */
      .scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          rgba(0, 0, 0, 0.3) 3px
        );
        pointer-events: none;
        z-index: 10;
        opacity: 0.6;
      }

      /* Vignette */
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 40%, #000 120%);
        z-index: 5;
        pointer-events: none;
      }

      /* Cyber HUD Ring */
      .hud-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 700px;
        height: 700px;
        border: 1px dashed rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        z-index: 0;
      }
      .hud-ring::before {
        content: '';
        position: absolute;
        inset: -20px;
        border: 1px solid rgba(168, 85, 247, 0.1);
        border-radius: 50%;
        border-right-color: transparent;
        border-bottom-color: transparent;
      }
      .hud-ring::after {
        content: '';
        position: absolute;
        inset: 40px;
        border: 2px solid rgba(6, 182, 212, 0.1);
        border-radius: 50%;
        border-left-color: transparent;
        border-top-color: transparent;
      }

      /* Background Grid/Network effect */
      .bg-effects {
        position: absolute;
        inset: 0;
        perspective: 1000px;
        z-index: -1;
      }
      .grid-lines {
        position: absolute;
        inset: -100%;
        background-image: 
          linear-gradient(rgba(168, 85, 247, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(168, 85, 247, 0.1) 1px, transparent 1px);
        background-size: 80px 80px;
        transform: rotateX(75deg);
        transform-origin: 50% 50%;
        mask-image: linear-gradient(to bottom, transparent, black 40%, transparent);
      }

      /* Floating Code Fragments */
      .code-fragments {
        position: absolute;
        color: rgba(6, 182, 212, 0.15);
        font-family: monospace;
        font-size: 14px;
        user-select: none;
      }
      .cf-1 { top: 15%; left: 10%; }
      .cf-2 { bottom: 20%; right: 10%; text-align: right; }
      .cf-3 { top: 15%; right: 15%; }

      .scenes {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 80px;
        z-index: 2;
      }

      .scene {
        width: 440px;
        height: 440px;
        perspective: 1600px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cube-assembly {
        position: relative;
        width: 300px;
        height: 300px;
        transform-style: preserve-3d;
        transform: rotateX(-15deg) rotateY(-25deg);
      }

      .cube-assembly.angle-a {
        transform: rotateX(-12deg) rotateY(-25deg);
      }

      .cube-assembly.angle-b {
        transform: rotateX(-12deg) rotateY(55deg);
      }
      
      /* Inner Glowing Box */
      .inner-cube {
        position: absolute;
        width: 180px;
        height: 180px;
        top: 60px;
        left: 60px;
        transform-style: preserve-3d;
      }
      .inner-face {
        position: absolute;
        width: 100%;
        height: 100%;
        background: var(--purple-core);
        opacity: 0.85;
        border-radius: 24px;
        box-shadow: 0 0 80px var(--purple-glow), inset 0 0 40px rgba(0,0,0,0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .inner-face.front  { transform: translateZ(90px); }
      .inner-face.back   { transform: rotateY(180deg) translateZ(90px); }
      .inner-face.right  { transform: rotateY(90deg) translateZ(90px); }
      .inner-face.left   { transform: rotateY(-90deg) translateZ(90px); }
      .inner-face.top    { transform: rotateX(90deg) translateZ(90px); }
      .inner-face.bottom { transform: rotateX(-90deg) translateZ(90px); }

      /* Outer Glass Box */
      .outer-cube {
        position: absolute;
        width: 300px;
        height: 300px;
        transform-style: preserve-3d;
      }
      .outer-face {
        position: absolute;
        width: 300px;
        height: 300px;
        background: var(--glass-surface);
        border: 2px solid var(--glass-border);
        border-radius: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        backface-visibility: visible;
        overflow: hidden;
        backdrop-filter: blur(2px);
      }

      .outer-face.front { 
        transform: translateZ(150px); 
        flex-direction: column;
        align-items: flex-start;
        padding-left: 40px;
        justify-content: center;
        border-color: rgba(255, 255, 255, 0.5);
      }

      .outer-face.right { 
        transform: rotateY(90deg) translateZ(150px); 
        align-items: flex-start;
        padding-left: 40px;
        padding-top: 80px;
        border-left: none; /* Make seams cleaner */
      }
      
      .outer-face.left { 
        transform: rotateY(-90deg) translateZ(150px); 
        align-items: flex-end;
        padding-right: 40px;
        padding-top: 80px;
        border-right: none;
        flex-direction: column;
        justify-content: flex-start;
      }

      .outer-face.back   { transform: rotateY(180deg) translateZ(150px); border-color: rgba(255,255,255,0.1); }
      .outer-face.top    { transform: rotateX(90deg) translateZ(150px); border-color: rgba(255,255,255,0.1); }
      .outer-face.bottom { transform: rotateX(-90deg) translateZ(150px); border-color: rgba(255,255,255,0.1); }

      /* Text Styles */
      .slnc-text {
        color: white;
        font-size: 72px;
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -2px;
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
        font-family: monospace; 
        background: linear-gradient(to bottom, #fff, #e2e8f0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .supreme-text {
        margin-top: 12px;
        margin-left: 5px;
        color: var(--cyan-accent);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 6px;
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(6, 182, 212, 0.8);
      }
      .side-text {
        display: flex;
        flex-direction: column;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: 700;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
        gap: 8px;
        text-shadow: 0 0 10px rgba(0,0,0,0.5);
      }

      /* Shine/Glass Effects */
      .outer-face::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(120deg, rgba(255,255,255,0.15) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.05) 100%);
        pointer-events: none;
      }
      .corner-highlight {
        position: absolute;
        width: 100%; height: 100%;
        border-radius: 40px;
        box-shadow: inset 0 0 30px rgba(168, 85, 247, 0.3);
        pointer-events: none;
      }

      .footer-title {
        position: absolute;
        bottom: 70px;
        left: 0;
        right: 0;
        text-align: center;
        color: white;
        z-index: 20;
      }
      .footer-main {
        font-size: 48px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 4px;
        background: linear-gradient(to right, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        margin-bottom: 8px;
      }
      .footer-sub {
        font-size: 18px;
        color: var(--cyan-accent);
        text-transform: uppercase;
        letter-spacing: 6px;
        margin-top: 10px;
        text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        font-weight: 600;
      }

    </style>
  </head>
  <body>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="bg-effects">
      <div class="grid-lines"></div>
      <div class="hud-ring"></div>
    </div>

    <!-- Decorative Code Blocks -->
    <div class="code-fragments cf-1">
      <div>0x4F 0x92 0x1A</div>
      <div>SYSTEM.INIT(SECURE)</div>
      <div>LOADING MODULES...</div>
    </div>
    <div class="code-fragments cf-2">
      <div>VULN_SCAN: ACTIVE</div>
      <div>THREAT_LEVEL: 0</div>
      <div>[//////////////////] 100%</div>
    </div>
    <div class="code-fragments cf-3">
       <div>:: ACCESS GRANTED ::</div>
    </div>

    <div class="footer-title">
      <div class="footer-main">Installation & Usage Guide</div>
      <div class="footer-sub">Secure Your Code</div>
    </div>

    <div class="scenes">
      <div class="scene">
        <div class="cube-assembly angle-a">
          <div class="inner-cube">
            <div class="inner-face front"></div>
            <div class="inner-face back"></div>
            <div class="inner-face right"></div>
            <div class="inner-face left"></div>
            <div class="inner-face top"></div>
            <div class="inner-face bottom"></div>
          </div>

          <div class="outer-cube">
            <div class="outer-face front">
              <div class="corner-highlight"></div>
              <div class="slnc-text">./SLNC</div>
              <div class="supreme-text">SUPREME</div>
            </div>
            <div class="outer-face right">
              <div class="corner-highlight"></div>
              <div class="side-text">
                <span>VIDEO</span>
                <span>GUIDE</span>
              </div>
            </div>
            <div class="outer-face back"></div>
            <div class="outer-face left"></div>
            <div class="outer-face top"></div>
            <div class="outer-face bottom"></div>
          </div>
        </div>
      </div>

      <div class="scene">
        <div class="cube-assembly angle-b">
          <div class="inner-cube">
            <div class="inner-face front"></div>
            <div class="inner-face back"></div>
            <div class="inner-face right"></div>
            <div class="inner-face left"></div>
            <div class="inner-face top"></div>
            <div class="inner-face bottom"></div>
          </div>

          <div class="outer-cube">
            <div class="outer-face front">
              <div class="corner-highlight"></div>
              <div class="slnc-text">./SLNC</div>
              <div class="supreme-text">SUPREME</div>
            </div>
            <div class="outer-face right"></div>
            <div class="outer-face back"></div>
            <div class="outer-face left">
              <div class="corner-highlight"></div>
              <div class="side-text" style="align-items: flex-end; text-align: right;">
                <span>WORLD'S FIRST</span>
                <span>MCP-BASED</span>
                <span>SCANNER</span>
              </div>
            </div>
            <div class="outer-face top"></div>
            <div class="outer-face bottom"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
